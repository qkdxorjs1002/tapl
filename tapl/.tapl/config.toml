[viewer]
# Additional browser origins allowed to call the viewer API through a trusted proxy.
# Type: array of unique strings. Each value must be an exact http:// or https://
# origin (scheme + host + optional port) without credentials, a path, query, or fragment.
# Keep [] for direct localhost use only. Example: ["https://tapl.example.com"]
allowed_origins = []

[search]
# Search backend. Allowed values:
# - "semantic": embedding similarity for conceptually related results.
# - "bm25": ranked lexical matching.
# - "word": simple word matching.
# - "hybrid": blend semantic and BM25 rankings.
mode = "hybrid"

# Default maximum number of workflow search results.
# Type: integer greater than or equal to 1.
max_results = 12

# Semantic weight used only by hybrid search.
# Type: number from 0.0 to 1.0. The BM25 weight is derived as 1.0 minus this
# value and is not configured separately. 0.65 favors concept search while
# preserving exact keyword matches.
hybrid_semantic_ratio = 0.65

# Semantic model provider. Allowed values:
# - "auto": use searchd when it is running, otherwise load the model locally.
# - "daemon": require the separately running searchd process.
# - "local": load the model in the current taplctl process.
semantic_provider = "auto"

# Seconds searchd keeps an idle semantic model loaded.
# Type: integer greater than or equal to 0. 0 disables automatic model unload;
# 1800 keeps the model warm for 30 minutes after the last search.
searchd_model_idle_timeout_seconds = 1800

[subagents]
# TAPL asks for SubAgent preferences on first use. Until setup is complete,
# SubAgent delegation remains inactive even when enabled is true.
setup_complete = false

# Whether eligible tasks may be delegated after setup. Type: true or false.
enabled = true

# Free-form preference captured during setup. It guides the agent's choices
# without naming provider models in TAPL defaults.
preference = ""

# Delegation strategy. Allowed values:
# - "conservative": delegate only when net efficiency is clearly established.
# - "balanced": prefer eligible non-trivial task groups.
# - "aggressive": delegate every eligible group, including small tasks, unless there is a clear, material downside.
strategy = "aggressive"

# Four model-neutral advisory task profiles are written explicitly below in
# priority order. The first applicable profile has priority, but profiles
# remain guidance that the agent can override.

[subagents.models]
# Delegation allowlist. Each key is a runtime-supported model ID and each value
# is a non-empty array of unique reasoning-effort strings supported by that model.
# It is empty until first-use setup records models available in the current
# runtime. TAPL does not advertise a provider model list.

# Edit, reorder, or replace these blocks to customize task routing after setup.
# `delegation_bias` is one of "inherit", "prefer", "neutral", or "avoid".
# Candidates are ordered preferences and every candidate must appear in the
# model allowlist above. Empty candidates let the runtime select from that list.

[[subagents.profiles]]
name = "high-risk-cross-cutting"
description = "High-risk, cross-cutting work where mistakes could affect security, data integrity, compatibility, or multiple system boundaries."
characteristics = "Broad changes across components; ambiguous failure modes; security, migration, concurrency, or irreversible-impact concerns."
delegation_bias = "avoid"
candidates = []

[[subagents.profiles]]
name = "deep-reasoning"
description = "Complex analysis or implementation that benefits from sustained reasoning and careful trade-off evaluation."
characteristics = "Novel architecture, subtle debugging, multi-step inference, competing constraints, or uncertain solution paths."
delegation_bias = "neutral"
candidates = []

[[subagents.profiles]]
name = "general-implementation"
description = "Typical implementation work with a clear outcome and moderate scope."
characteristics = "Feature changes, refactoring, integration work, and tests spanning a small number of related components."
delegation_bias = "inherit"
candidates = []

[[subagents.profiles]]
name = "bounded-routine"
description = "Small, well-scoped routine work with clear inputs, outputs, and verification."
characteristics = "Local edits, mechanical updates, focused tests, and predictable implementation with limited context."
delegation_bias = "prefer"
candidates = []
