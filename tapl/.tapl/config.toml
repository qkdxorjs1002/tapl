[viewer]
# Exact browser origins allowed to call the viewer API through a trusted proxy.
# Keep this empty when the viewer is only used from localhost.
allowed_origins = []

[search]
# Search mode: semantic, bm25, word, or hybrid.
mode = "hybrid"

# Default maximum number of workflow search results.
max_results = 12

# Hybrid search blends semantic rank and BM25 rank.
# 0.65 keeps concept search dominant while preserving exact keyword matches.
hybrid_semantic_ratio = 0.65

# Semantic provider: auto, daemon, or local.
# auto uses searchd when it is already running, then falls back to local loading.
semantic_provider = "auto"

# 0 disables model unload. The default keeps the model warm for 30 minutes after the last search.
searchd_model_idle_timeout_seconds = 1800

[subagents]
# Enable subagent delegation for eligible tasks.
enabled = true

# conservative proves net efficiency; balanced prefers eligible non-trivial groups;
# aggressive prefers every eligible group, including small tasks.
strategy = "balanced"

# Each model maps to the reasoning-effort levels available for delegation.
[subagents.models]
"gpt-5.6-sol" = ["medium", "high", "xhigh", "max"]
"gpt-5.6-terra" = ["high", "xhigh"]
"gpt-5.6-luna" = ["xhigh", "max"]
