name: Windows lifecycle tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/windows-*
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-installer-tests:
    name: Windows lifecycle (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Parse installer and lifecycle smoke with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($script in @('install.ps1', '.github/scripts/install-windows.ps1', '.github/scripts/windows_install_smoke.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script).Path, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error $_.Message }
              throw "$script contains PowerShell syntax errors."
            }
          }

      - name: Test Windows runtime regressions
        run: |
          python -m pip install "./tapl[test]"
          python -m pytest -q tapl/tests/test_windows_runtime.py

      - name: Test version-bound Windows release assets
        run: python -m unittest -v tapl.tests.test_release_packaging.WindowsInstallerAssetTests

      - name: Build actual TAPL wheel
        run: python -m pip wheel --no-deps --wheel-dir dist ./tapl

      - name: Test actual wheel install, update, reinstall, uninstall and CLI/MCP runtime
        shell: powershell
        run: |
          $wheel = (Get-ChildItem -LiteralPath dist -Filter 'taplctl-*.whl').FullName
          ./.github/scripts/windows_install_smoke.ps1 -Wheel $wheel -Python (Get-Command python).Source

      - name: Run Windows installer tests (stdlib-only fixtures)
        run: python -m unittest -v tapl.tests.test_installer_windows tapl.tests.test_installer_bootstrap --failfast
