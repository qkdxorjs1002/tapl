name: Windows installer tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows-installer-tests:
    name: Windows installer tests (Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Windows installer tests (stdlib-only fixtures)
        run: python -m unittest -v tapl.tests.test_installer_windows
