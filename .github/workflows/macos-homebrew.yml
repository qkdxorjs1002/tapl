name: macOS Homebrew signatures

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/scripts/*homebrew*'
      - '.github/scripts/sign_macos*'
      - '.github/workflows/macos-homebrew.yml'
      - '.github/workflows/release.yml'
      - 'tapl/pyproject.toml'
  pull_request:
    paths:
      - '.github/scripts/*homebrew*'
      - '.github/scripts/sign_macos*'
      - '.github/workflows/macos-homebrew.yml'
      - '.github/workflows/release.yml'
      - 'tapl/pyproject.toml'

permissions:
  contents: read

concurrency:
  group: homebrew-signatures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Homebrew signatures (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build TAPL wheel for installation check
        run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/homebrew-app" ./tapl
      - name: Download published signed runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TARGET: ${{ matrix.target }}
        run: >-
          gh release download --repo qkdxorjs1002/tapl
          --pattern "taplctl-mcp-runtime-*-${RUNTIME_TARGET}.tar.gz"
          --dir "${RUNNER_TEMP}/homebrew-runtime"
      - name: Verify signatures after Homebrew install and reinstall
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          wheels=("${RUNNER_TEMP}"/homebrew-app/*.whl)
          runtimes=("${RUNNER_TEMP}"/homebrew-runtime/*.tar.gz)
          python .github/scripts/verify_homebrew_macos.py \
            --wheel "${wheels[0]}" --runtime "${runtimes[0]}" --team-id "${APPLE_TEAM_ID}"
