name: macOS Homebrew signatures

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/scripts/*homebrew*'
      - '.github/scripts/sign_macos*'
      - '.github/scripts/semantic_runtime_smoke.py'
      - '.github/workflows/macos-homebrew.yml'
      - '.github/workflows/release-ctl.yml'
      - 'tapl/pyproject.toml'
  pull_request:
    paths:
      - '.github/scripts/*homebrew*'
      - '.github/scripts/sign_macos*'
      - '.github/scripts/semantic_runtime_smoke.py'
      - '.github/workflows/macos-homebrew.yml'
      - '.github/workflows/release-ctl.yml'
      - 'tapl/pyproject.toml'

permissions:
  contents: read

concurrency:
  group: homebrew-signatures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Homebrew signatures (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build TAPL wheel for installation check
        run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/homebrew-app" ./tapl
      - name: Download published signed runtimes for one release
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$(gh release view --repo qkdxorjs1002/tapl --json tagName --jq '.tagName')"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          names=(--pattern "taplctl-mcp-runtime-${tag}-${RUNTIME_TARGET}.tar.gz")
          if [[ "${RUNTIME_TARGET}" == macos-arm64 ]]; then
            if [[ "${tag}" == 2.24.2 ]]; then
              # This is the final stable tag published with an MCP-only wheelhouse.
              echo "legacy=true" >> "${GITHUB_OUTPUT}"
            else
              names+=(--pattern "taplctl-semantic-runtime-${tag}-${RUNTIME_TARGET}.tar.gz")
            fi
          fi
          gh release download "${tag}" --repo qkdxorjs1002/tapl "${names[@]}" --dir "${RUNNER_TEMP}/homebrew-runtime"

      - name: Check out the MCP-only release verifier
        if: steps.assets.outputs.legacy == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.assets.outputs.tag }}
          path: published

      - name: Verify signatures after Homebrew install and reinstall
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          TAG: ${{ steps.assets.outputs.tag }}
          LEGACY: ${{ steps.assets.outputs.legacy }}
          RUNTIME_TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          wheels=("${RUNNER_TEMP}"/homebrew-app/*.whl)
          assets="${RUNNER_TEMP}/homebrew-runtime"
          args=(--wheel "${wheels[0]}" --runtime "${assets}/taplctl-mcp-runtime-${TAG}-${RUNTIME_TARGET}.tar.gz"
                --team-id "${APPLE_TEAM_ID}")
          verifier=.github/scripts/verify_homebrew_macos.py
          if [[ "${LEGACY}" == true ]]; then
            verifier="published/${verifier}"
          elif [[ "${RUNTIME_TARGET}" == macos-arm64 ]]; then
            args+=(--semantic-runtime "${assets}/taplctl-semantic-runtime-${TAG}-${RUNTIME_TARGET}.tar.gz")
          fi
          python "${verifier}" "${args[@]}"
