name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer-preflight:
    name: Windows installer release preflight (PowerShell 5.1)
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify install.ps1 with the PowerShell 5.1 parser
        shell: powershell
        run: |
          $installer = Resolve-Path "install.ps1" -ErrorAction Stop
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            $installer.Path,
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw "install.ps1 contains PowerShell syntax errors."
          }

      - name: Run Windows installer tests (stdlib-only fixtures)
        run: python -m unittest -v tapl.tests.test_installer_windows

  release:
    name: Build and publish release
    needs: windows-installer-preflight
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use x.y.z format. Got: ${version}" >&2
            exit 1
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Require Homebrew tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "Set the HOMEBREW_TAP_TOKEN secret with write access to qkdxorjs1002/homebrew-tap." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync package versions
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]

          pyproject = Path("tapl/pyproject.toml")
          pyproject_text = pyproject.read_text()
          pyproject_text, pyproject_count = re.subn(
              r'(?m)^version = "[^"]+"$',
              f'version = "{version}"',
              pyproject_text,
              count=1,
          )
          if pyproject_count != 1:
              raise SystemExit("Could not update tapl/pyproject.toml version")
          pyproject.write_text(pyproject_text)

          package_json = Path("vscode-extension/package.json")
          package_data = json.loads(package_json.read_text())
          package_data["version"] = version
          package_json.write_text(json.dumps(package_data, indent=2) + "\n")
          PY

      - name: Build shared viewer assets
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail

          npm install --package-lock=false
          npm run compile

      - name: Build Python wheel
        working-directory: tapl
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip build
          python -m build --wheel --outdir ../release-dist

      - name: Build MCP runtime wheelhouses
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mcp_requirement="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("tapl/pyproject.toml").read_text(encoding="utf-8"))["project"]
          matches = [item for item in project["dependencies"] if item.startswith("mcp==")]
          if len(matches) != 1:
              raise SystemExit("tapl must pin exactly one mcp== runtime dependency")
          print(matches[0])
          PY
          )"

          targets=(macos-arm64 macos-x86_64 linux-arm64 linux-x86_64)
          platforms=(macosx_11_0_arm64 macosx_10_13_x86_64 manylinux2014_aarch64 manylinux2014_x86_64)
          for index in "${!targets[@]}"; do
            target="${targets[index]}"
            platform="${platforms[index]}"
            wheelhouse="${RUNNER_TEMP}/taplctl-mcp-runtime-${target}"
            archive="release-dist/taplctl-mcp-runtime-${RELEASE_VERSION}-${target}.tar.gz"

            rm -rf "${wheelhouse}"
            mkdir -p "${wheelhouse}"
            python -m pip download \
              --disable-pip-version-check \
              --only-binary=:all: \
              --platform "${platform}" \
              --python-version 3.12 \
              --implementation cp \
              --dest "${wheelhouse}" \
              "${mcp_requirement}"

            python - "${wheelhouse}" <<'PY'
          import re
          import sys
          from pathlib import Path

          wheelhouse = Path(sys.argv[1])
          distributions = {
              path.name.split("-", 1)[0].lower()
              for path in wheelhouse.glob("*.whl")
          }
          required = {"mcp", "mcp_types", "pydantic", "pydantic_core", "cryptography"}
          missing = sorted(required - distributions)
          if missing:
              raise SystemExit(f"MCP runtime wheelhouse is incomplete: {', '.join(missing)}")
          for path in wheelhouse.iterdir():
              if not path.is_file() or re.search(r"\.whl$", path.name) is None:
                  raise SystemExit(f"unexpected MCP runtime asset: {path.name}")
          PY

            tar \
              --sort=name \
              --mtime='UTC 1970-01-01' \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "${wheelhouse}" \
              -czf "${archive}" \
              .
          done

      - name: Build VS Code extension package
        working-directory: vscode-extension
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          npm exec -- vsce package \
            --allow-missing-repository \
            --out "../release-dist/tapl-workflow-viewer-${RELEASE_VERSION}.vsix"

      - name: Prepare release assets
        id: assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          wheel_path="release-dist/taplctl-${RELEASE_VERSION}-py3-none-any.whl"
          vsix_path="release-dist/tapl-workflow-viewer-${RELEASE_VERSION}.vsix"

          test -f "${wheel_path}"
          test -f "${vsix_path}"

          wheel_name="$(basename "${wheel_path}")"
          wheel_sha256="$(sha256sum "${wheel_path}" | awk '{print $1}')"
          wheel_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${wheel_name}"
          manifest_path="release-dist/taplctl-install-manifest.json"

          python - "${manifest_path}" "${RELEASE_VERSION}" "${wheel_url}" "${wheel_sha256}" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          manifest = {
              "schema_version": 1,
              "version": sys.argv[2],
              "wheel": {
                  "url": sys.argv[3],
                  "sha256": sys.argv[4],
              },
          }
          manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          echo "wheel_name=${wheel_name}" >> "${GITHUB_OUTPUT}"
          echo "wheel_sha256=${wheel_sha256}" >> "${GITHUB_OUTPUT}"
          echo "wheel_url=${wheel_url}" >> "${GITHUB_OUTPUT}"

          for target in macos-arm64 macos-x86_64 linux-arm64 linux-x86_64; do
            runtime_name="taplctl-mcp-runtime-${RELEASE_VERSION}-${target}.tar.gz"
            runtime_path="release-dist/${runtime_name}"
            runtime_sha256="$(sha256sum "${runtime_path}" | awk '{print $1}')"
            runtime_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${runtime_name}"
            output_key="${target//-/_}"

            test -f "${runtime_path}"
            echo "mcp_runtime_${output_key}_name=${runtime_name}" >> "${GITHUB_OUTPUT}"
            echo "mcp_runtime_${output_key}_sha256=${runtime_sha256}" >> "${GITHUB_OUTPUT}"
            echo "mcp_runtime_${output_key}_url=${runtime_url}" >> "${GITHUB_OUTPUT}"
          done

          ls -lh release-dist

      - name: Validate release assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          WHEEL_NAME: ${{ steps.assets.outputs.wheel_name }}
          WHEEL_URL: ${{ steps.assets.outputs.wheel_url }}
          WHEEL_SHA256: ${{ steps.assets.outputs.wheel_sha256 }}
          MCP_RUNTIME_MACOS_ARM64_URL: ${{ steps.assets.outputs.mcp_runtime_macos_arm64_url }}
          MCP_RUNTIME_MACOS_ARM64_SHA256: ${{ steps.assets.outputs.mcp_runtime_macos_arm64_sha256 }}
          MCP_RUNTIME_MACOS_X86_64_URL: ${{ steps.assets.outputs.mcp_runtime_macos_x86_64_url }}
          MCP_RUNTIME_MACOS_X86_64_SHA256: ${{ steps.assets.outputs.mcp_runtime_macos_x86_64_sha256 }}
          MCP_RUNTIME_LINUX_ARM64_URL: ${{ steps.assets.outputs.mcp_runtime_linux_arm64_url }}
          MCP_RUNTIME_LINUX_ARM64_SHA256: ${{ steps.assets.outputs.mcp_runtime_linux_arm64_sha256 }}
          MCP_RUNTIME_LINUX_X86_64_URL: ${{ steps.assets.outputs.mcp_runtime_linux_x86_64_url }}
          MCP_RUNTIME_LINUX_X86_64_SHA256: ${{ steps.assets.outputs.mcp_runtime_linux_x86_64_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          sh -n install.sh
          python - "release-dist/taplctl-install-manifest.json" "release-dist/${WHEEL_NAME}" "${RELEASE_VERSION}" "${WHEEL_URL}" "${WHEEL_SHA256}" <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import tarfile
          from pathlib import Path

          manifest_path = Path(sys.argv[1])
          wheel_path = Path(sys.argv[2])
          version, wheel_url, wheel_sha256 = sys.argv[3:]

          if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", version) is None:
              raise SystemExit("invalid release version")
          if re.fullmatch(r"[0-9a-f]{64}", wheel_sha256) is None:
              raise SystemExit("invalid wheel SHA-256")
          expected_wheel_name = f"taplctl-{version}-py3-none-any.whl"
          expected_wheel_url = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
              f"{os.environ['GITHUB_REF_NAME']}/{expected_wheel_name}"
          )
          if wheel_path.name != expected_wheel_name:
              raise SystemExit(f"unexpected wheel filename: {wheel_path.name}")
          if wheel_url != expected_wheel_url:
              raise SystemExit(f"unexpected wheel URL: {wheel_url}")
          if not wheel_path.is_file():
              raise SystemExit(f"wheel is missing: {wheel_path}")

          expected = {
              "schema_version": 1,
              "version": version,
              "wheel": {
                  "url": wheel_url,
                  "sha256": wheel_sha256,
              },
          }
          try:
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"invalid install manifest JSON: {exc}")
          if manifest != expected:
              raise SystemExit("install manifest does not match the required schema or release asset metadata")

          actual_sha256 = hashlib.sha256(wheel_path.read_bytes()).hexdigest()
          if actual_sha256 != wheel_sha256:
              raise SystemExit(
                  f"wheel SHA-256 mismatch: expected {wheel_sha256}, got {actual_sha256}"
              )

          required_runtime_distributions = {
              "mcp",
              "mcp_types",
              "pydantic",
              "pydantic_core",
              "cryptography",
          }
          runtime_targets = {
              "macos_arm64": "macos-arm64",
              "macos_x86_64": "macos-x86_64",
              "linux_arm64": "linux-arm64",
              "linux_x86_64": "linux-x86_64",
          }
          for target, asset_target in runtime_targets.items():
              archive_name = f"taplctl-mcp-runtime-{version}-{asset_target}.tar.gz"
              archive_path = Path("release-dist") / archive_name
              expected_url = (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/"
                  f"{os.environ['GITHUB_REF_NAME']}/{archive_name}"
              )
              runtime_url = os.environ[f"MCP_RUNTIME_{target.upper()}_URL"]
              runtime_sha256 = os.environ[f"MCP_RUNTIME_{target.upper()}_SHA256"]
              if runtime_url != expected_url:
                  raise SystemExit(f"unexpected MCP runtime URL for {target}: {runtime_url}")
              if re.fullmatch(r"[0-9a-f]{64}", runtime_sha256) is None:
                  raise SystemExit(f"invalid MCP runtime SHA-256 for {target}")
              actual_runtime_sha256 = hashlib.sha256(archive_path.read_bytes()).hexdigest()
              if actual_runtime_sha256 != runtime_sha256:
                  raise SystemExit(
                      f"MCP runtime SHA-256 mismatch for {target}: "
                      f"expected {runtime_sha256}, got {actual_runtime_sha256}"
                  )
              with tarfile.open(archive_path, "r:gz") as archive:
                  wheels = [Path(member.name).name for member in archive.getmembers() if member.isfile()]
              distributions = {name.split("-", 1)[0].lower() for name in wheels if name.endswith(".whl")}
              missing = sorted(required_runtime_distributions - distributions)
              if missing:
                  raise SystemExit(
                      f"MCP runtime archive {target} is missing: {', '.join(missing)}"
                  )
          PY

      - name: Smoke-test isolated MCP runtime
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          WHEEL_NAME: ${{ steps.assets.outputs.wheel_name }}
        shell: bash
        run: |
          set -euo pipefail

          smoke_root="${RUNNER_TEMP}/tapl-mcp-release-smoke"
          runtime_dir="${smoke_root}/runtime"
          workspace="${smoke_root}/workspace"
          rm -rf "${smoke_root}"
          mkdir -p "${runtime_dir}" "${workspace}"
          tar -xzf "release-dist/taplctl-mcp-runtime-${RELEASE_VERSION}-linux-x86_64.tar.gz" \
            -C "${runtime_dir}"
          python -m venv "${smoke_root}/venv"
          "${smoke_root}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps --no-compile \
            "${runtime_dir}"/*.whl
          "${smoke_root}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps --no-compile \
            "release-dist/${WHEEL_NAME}"
          "${smoke_root}/venv/bin/taplctl" --version
          "${smoke_root}/venv/bin/taplctl" init --workspace-root "${workspace}" --json
          "${smoke_root}/venv/bin/python" - "${workspace}" <<'PY'
          import asyncio
          import sys
          from pathlib import Path

          from mcp import Client
          from taplctl.mcp_server import create_server

          async def main() -> None:
              server = create_server(workspace_root=Path(sys.argv[1]))
              async with Client(server) as client:
                  tools = await client.list_tools()
                  if len(tools.tools) != 20:
                      raise SystemExit(f"expected 20 TAPL MCP tools, got {len(tools.tools)}")
                  result = await client.call_tool("tapl_get_status", {})
                  if result.is_error:
                      raise SystemExit("tapl_get_status failed in isolated runtime")

          asyncio.run(main())
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release-dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" release-dist/* \
              --title "taplctl ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: qkdxorjs1002/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update taplctl Homebrew package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          WHEEL_SHA256: ${{ steps.assets.outputs.wheel_sha256 }}
          WHEEL_URL: ${{ steps.assets.outputs.wheel_url }}
          MCP_RUNTIME_MACOS_ARM64_URL: ${{ steps.assets.outputs.mcp_runtime_macos_arm64_url }}
          MCP_RUNTIME_MACOS_ARM64_SHA256: ${{ steps.assets.outputs.mcp_runtime_macos_arm64_sha256 }}
          MCP_RUNTIME_MACOS_X86_64_URL: ${{ steps.assets.outputs.mcp_runtime_macos_x86_64_url }}
          MCP_RUNTIME_MACOS_X86_64_SHA256: ${{ steps.assets.outputs.mcp_runtime_macos_x86_64_sha256 }}
          MCP_RUNTIME_LINUX_ARM64_URL: ${{ steps.assets.outputs.mcp_runtime_linux_arm64_url }}
          MCP_RUNTIME_LINUX_ARM64_SHA256: ${{ steps.assets.outputs.mcp_runtime_linux_arm64_sha256 }}
          MCP_RUNTIME_LINUX_X86_64_URL: ${{ steps.assets.outputs.mcp_runtime_linux_x86_64_url }}
          MCP_RUNTIME_LINUX_X86_64_SHA256: ${{ steps.assets.outputs.mcp_runtime_linux_x86_64_sha256 }}
        shell: bash
        run: |
          set -euo pipefail

          brew_files=()
          if [[ -f "homebrew-tap/Formula/taplctl.rb" ]]; then
            brew_files+=("homebrew-tap/Formula/taplctl.rb")
          elif [[ -f "homebrew-tap/Casks/taplctl.rb" ]]; then
            brew_files+=("homebrew-tap/Casks/taplctl.rb")
          fi
          if [[ -f "homebrew-tap/Formula/taplctl-semantic.rb" ]]; then
            brew_files+=("homebrew-tap/Formula/taplctl-semantic.rb")
          fi

          if [[ "${#brew_files[@]}" -eq 0 ]]; then
            echo "Could not find Formula/taplctl.rb or Casks/taplctl.rb in qkdxorjs1002/homebrew-tap." >&2
            exit 1
          fi

          ruby -c .github/scripts/update_homebrew_formula.rb
          ruby .github/scripts/update_homebrew_formula.rb "${brew_files[@]}"
          for brew_file in "${brew_files[@]}"; do
            ruby -c "${brew_file}"
          done

          tap_paths=()
          for brew_file in "${brew_files[@]}"; do
            tap_paths+=("${brew_file#homebrew-tap/}")
          done

          git -C homebrew-tap config user.name "github-actions[bot]"
          git -C homebrew-tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C homebrew-tap add "${tap_paths[@]}"

          if git -C homebrew-tap diff --cached --quiet; then
            echo "Homebrew tap is already up to date."
            exit 0
          fi

          git -C homebrew-tap commit -m "taplctl ${RELEASE_VERSION}"
          git -C homebrew-tap push
