name: Release Viewer

on:
  push:
    tags:
      - 'viewer-*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Check Viewer release inputs
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      baseline: ${{ steps.plan.outputs.baseline }}
      publish: ${{ steps.plan.outputs.publish }}
      existing_asset: ${{ steps.plan.outputs.existing_asset }}
      tag_object: ${{ steps.plan.outputs.tag_object }}

    steps:
      - name: Checkout source and release tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version and compare published Viewer inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases_file="${RUNNER_TEMP}/viewer-releases.json"
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${releases_file}"
          python .github/scripts/viewer_release.py "${GITHUB_REF_NAME}" \
            --releases "${releases_file}" --expected-commit "${GITHUB_SHA}" \
            --github-output "${GITHUB_OUTPUT}"

  build:
    name: Build and verify VSIX
    needs: plan
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.existing_asset == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync VS Code extension version
        env:
          TAG_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          package_json = Path("vscode-extension/package.json")
          package_data = json.loads(package_json.read_text(encoding="utf-8"))
          package_data["version"] = os.environ["TAG_VERSION"]
          package_json.write_text(json.dumps(package_data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Validate Marketplace icon dimensions
        run: |
          python -m pip install PyYAML
          python -m unittest -v tapl.tests.test_release_packaging.VsCodeMarketplaceAssetTests

      - name: Build shared Viewer assets
        working-directory: vscode-extension
        shell: bash
        run: |
          set -euo pipefail

          rm -rf out webview-dist
          npm install --package-lock=false
          npm run test:host
          npm run compile

      - name: Package versioned VSIX
        working-directory: vscode-extension
        env:
          TAG_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ../release-dist
          npm exec -- vsce package \
            --no-dependencies \
            --allow-missing-repository \
            --out "../release-dist/tapl-workflow-viewer-${TAG_VERSION}.vsix"

      - name: Upload validated VSIX
        uses: actions/upload-artifact@v4
        with:
          name: viewer-vsix-${{ needs.plan.outputs.version }}
          path: release-dist/tapl-workflow-viewer-${{ needs.plan.outputs.version }}.vsix
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish Viewer GitHub Release
    needs: [plan, build]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download validated VSIX
        if: needs.plan.outputs.existing_asset == 'false'
        uses: actions/download-artifact@v4
        with:
          name: viewer-vsix-${{ needs.plan.outputs.version }}
          path: release-dist

      - name: Verify existing tag and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TAG_OBJECT: ${{ needs.plan.outputs.tag_object }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          BASELINE_TAG: ${{ needs.plan.outputs.baseline }}
          EXISTING_ASSET: ${{ needs.plan.outputs.existing_asset }}
          TAG_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          release_ref="refs/tags/${RELEASE_TAG}"
          remote_tag="$(git ls-remote --exit-code --refs origin "${release_ref}")"
          if [[ "${remote_tag}" != "${RELEASE_TAG_OBJECT}"$'\t'"${release_ref}" ]]; then
            echo "Viewer tag changed since release inputs were verified." >&2
            exit 1
          fi

          vsix="release-dist/tapl-workflow-viewer-${TAG_VERSION}.vsix"
          title="TAPL Viewer ${TAG_VERSION}"
          if [[ "${EXISTING_ASSET}" == "true" ]]; then
            gh release edit "${RELEASE_TAG}" --verify-tag --title "${title}" \
              --latest=false --prerelease="${RELEASE_PRERELEASE}"
          elif gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${vsix}" --clobber
            gh release edit "${RELEASE_TAG}" --verify-tag --title "${title}" \
              --latest=false --prerelease="${RELEASE_PRERELEASE}" --draft=false
          else
            notes_args=(--generate-notes)
            if [[ -n "${BASELINE_TAG}" ]]; then
              notes_args+=(--notes-start-tag "${BASELINE_TAG}")
            fi
            gh release create "${RELEASE_TAG}" "${vsix}" --verify-tag --title "${title}" \
              --latest=false --prerelease="${RELEASE_PRERELEASE}" "${notes_args[@]}"
          fi

  marketplace:
    name: Publish stable VS Code extension
    needs: [plan, release]
    if: needs.plan.outputs.prerelease == 'false'
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install VS Code extension publisher
        working-directory: vscode-extension
        run: npm install --package-lock=false --ignore-scripts

      - name: Download released VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_VERSION: ${{ needs.plan.outputs.version }}
        run: >-
          gh release download "${RELEASE_TAG}"
          --pattern "tapl-workflow-viewer-${TAG_VERSION}.vsix"
          --dir release-dist

      - name: Publish VS Code extension to Marketplace
        working-directory: vscode-extension
        env:
          TAG_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          npm exec -- vsce publish \
            --oidc \
            --packagePath "../release-dist/tapl-workflow-viewer-${TAG_VERSION}.vsix" \
            --skip-duplicate
